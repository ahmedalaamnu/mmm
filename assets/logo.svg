<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Linear Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#FDF0CD" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>

    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B2E" />
      <stop offset="50%" stop-color="#0A1322" />
      <stop offset="100%" stop-color="#060B14" />
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer Emblem Shield / Diamond Polygon -->
  <g filter="url(#softShadow)">
    <!-- Outer Octagonal Ring -->
    <polygon points="120,12 196,44 228,120 196,196 120,228 44,196 12,120 44,44" 
             fill="url(#navyBg)" 
             stroke="url(#goldLinear)" 
             stroke-width="3" />

    <!-- Inner Decorative Border -->
    <polygon points="120,24 186,52 214,120 186,188 120,216 54,188 26,120 54,52" 
             fill="none" 
             stroke="url(#goldSheen)" 
             stroke-width="1.2" 
             stroke-dasharray="6,3" 
             opacity="0.85" />
  </g>

  <!-- Central Emblem: The Regal Luxury Number '4' -->
  <!-- Designed with beveled facets and sharp architectural proportions -->
  <g filter="url(#goldGlow)" id="numeral-4">
    <!-- Left Angled Diagonal Pillar -->
    <path d="M 124 50 L 64 148 L 94 148 L 138 74 Z" 
          fill="url(#goldSheen)" />

    <!-- Left Diagonal Shadow Edge for 3D Chisel -->
    <path d="M 124 50 L 138 74 L 130 84 L 118 64 Z" 
          fill="#593E07" 
          opacity="0.75" />

    <!-- Horizontal Crossbar -->
    <path d="M 54 140 L 186 140 L 186 162 L 54 162 Z" 
          fill="url(#goldLinear)" />

    <!-- Horizontal Bar Highlight Top Bevel -->
    <line x1="54" y1="140" x2="186" y2="140" stroke="#FFF7D6" stroke-width="1.8" />
    <line x1="54" y1="162" x2="186" y2="162" stroke="#5A3F0A" stroke-width="1.8" />

    <!-- Vertical Stem -->
    <path d="M 134 44 L 164 44 L 164 196 L 134 196 Z" 
          fill="url(#goldSheen)" />

    <!-- Vertical Stem Highlight & Chisel bevel -->
    <line x1="134" y1="44" x2="134" y2="196" stroke="#FFF7D6" stroke-width="1.5" />
    <line x1="164" y1="44" x2="164" y2="196" stroke="#5A3F0A" stroke-width="1.5" />

    <!-- Center Cut Accent Jewel / Diamond -->
    <polygon points="120,110 128,122 120,134 112,122" 
             fill="#FFF4C2" 
             opacity="0.9" />

    <!-- Golden Crest Corner Stars -->
    <circle cx="120" cy="34" r="2.5" fill="#FFEAA7" />
    <circle cx="120" cy="206" r="2.5" fill="#FFEAA7" />
    <circle cx="34" cy="120" r="2.5" fill="#FFEAA7" />
    <circle cx="206" cy="120" r="2.5" fill="#FFEAA7" />
  </g>
</svg>

